name: Frontend CI/CD

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install
      run: npm ci

    - name: Lint & Test
      run: npm run test-all

    - name: Build
      run: npm run build

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Determine image tag
      id: image_tag
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "tag=latest" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
          echo "tag=staging" >> $GITHUB_OUTPUT
        fi

     - name: Build and push image
       run: |
         docker build -f frontend/Dockerfile -t ${{ secrets.DOCKER_HUB_USERNAME }}/ncct_project-frontend:${{ steps.image_tag.outputs.tag }} frontend/
         docker push ${{ secrets.DOCKER_HUB_USERNAME }}/ncct_project-frontend:${{ steps.image_tag.outputs.tag }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.STAGING_DO_HOST }}
          username: ${{ secrets.STAGING_DO_USER }}
          key: ${{ secrets.STAGING_DO_SSH_KEY }}
          script: |
            cd /srv/ncct_project-frontend-staging
            docker-compose pull
            docker-compose up -d --remove-orphans

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PRODUCTION_DO_HOST }}
          username: ${{ secrets.PRODUCTION_DO_USER }}
          key: ${{ secrets.PRODUCTION_DO_SSH_KEY }}
          script: |
            cd /srv/ncct_project-frontend
            docker-compose pull
            docker-compose up -d --remove-orphans