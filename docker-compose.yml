services:
  nc2t-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder # Use the Node.js stage so npm is available for dev
    container_name: nc2t-app
    ports:
      - "3000:5173" # Map host port 3000 to Vite dev server port
    environment:
      - NODE_ENV=development # Set NODE_ENV to development
      - VITE_HMR_SERVER_ORIGIN=http://localhost:3000 # For HMR to work inside docker
    volumes:
      - .:/app # Mount the current directory to /app in the container
      - /app/node_modules # Exclude node_modules from the volume mount
    command: npm run dev -- --host --port 5173 # Run Vite dev server from Node stage
    restart: unless-stopped
    networks:
      - nc2t-network

networks:
  nc2t-network:
    driver: bridge
