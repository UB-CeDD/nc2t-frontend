version: '3.8'

services:
  nc2t-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nc2t-app
    ports:
      - "3000:80" # Map host port 80 to container port 80
    environment:
      - NODE_ENV=production # Set NODE_ENV to production
    restart: unless-stopped
    networks:
      - nc2t-network

networks:
  nc2t-network:
    driver: bridge
